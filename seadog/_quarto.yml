project:
  type: website

website:
  title: "seadog"
  site-url: https://ericpante.github.io

  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
      - href: publications.qmd
        text: Publications
  
  sidebar:
   contents:
    - section: "Projects"
      href: projects.qmd
      contents:
        - section: Biodiversity 3
          href: projects/biodiversity3.qmd
          contents:
            - auto: "projects/biodiversity3/*scoping*.qmd"
        - text: Ocean 2
          href: projects/ocean2.qmd
        - text: Drive
          href: projects/dui.qmd
        - text: marmap
          href: projects/marmap.qmd
        - section: DaunPapua
          href: projects/daunpapua.qmd
          contents:
            - auto: "projects/daunpapua_db/*.qmd"

  page-footer:
    center: "made with [quarto](https://quarto.org/), an open source scientific publishing system. To see the code, click [here](https://github.com/ericpante/ericpante.github.io)"
 
  bread-crumbs: false
  
format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true

editor: visual

extensions:
  badge:
    - key: current
      colour: springgreen
    - key: future
      class: bg-danger
      href: https://github.com/mcanouil/quarto-badge@2.4.0
    - key: deprecated
      class: bg-warning
      href: https://github.com/mcanouil/quarto-badge@2.4.0/releases/tag/{{value}}
    - key: stable
      colour: "#28a745"
    - key: beta
      colour: "#ffc107"
    - key: experimental
      class: bg-info
